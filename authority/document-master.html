{% extends 'baseAuthority.html' %}
{% load static %}

{% block title %}ATMS Document Master{% endblock %}

{% block content %}
<div class="container">
  <div class="page-inner">
    <div class="page-header d-print-none">
      <h4 class="fw-bold mb-3">Document Master</h4>
      <ul class="breadcrumbs mb-3">
        <li class="nav-home">
          <a href="{% url 'dashboard' %}">
            <i class="ri-home-3-line"></i>
          </a>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-home">
          <span class="op-7">ADV Setup</span>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <span class="op-7">Document Master</span>
        </li>
      </ul>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header d-print-none text-start">
            <a href="{% url 'document-add' %}"><button class="btn btn-primary btn-sm"><strong><i class="ri-add-line"></i> Add New</strong></button></a>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table id="basic-datatables" class="display table table-hover table-bordered table-head-bg-info text-center">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Document</th>
                    <th>Added Date</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>1</td>
                    <td>Aadhaar Card</td>
                    <td>June 1, 2026</td>
                    <td><a href="{% url 'document-view' %}"><button class="btn btn-info btn-sm">View</button></a></td>
                  </tr>
                  <tr>
                    <td>2</td>
                    <td>Voter ID</td>
                    <td>June 1, 2026</td>
                    <td><a href="{% url 'document-view' %}"><button class="btn btn-info btn-sm">View</button></a></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
